# `local_backend: true` still lets Decap talk to a local `decap-server`
# proxy (via `npm run cms`) when one is running on localhost, so this keeps
# working for fully offline local testing with no login at all.
#
# For everyone else (the real, deployed site), `base_url` points at a small
# dedicated Cloudflare Worker (oauth-worker/) that handles the GitHub OAuth
# handshake, since that exchange needs a client secret that can't live in
# the browser. See the Decap CMS docs: https://decapcms.org/docs/github-backend/
backend:
  name: github
  repo: xaerr0/mark-bransky-fitness
  branch: master
  base_url: https://bransky-fitness-oauth.xaerr00.workers.dev
  auth_endpoint: auth

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Photo", name: "image", widget: "image", required: false, hint: "Shows on the blog list and at the top of the post." }
      - { label: "Photo alt text (describe the photo for screen readers)", name: "imageAlt", widget: "string", required: false }
      - { label: "External URL (leave blank for a normal post)", name: "externalUrl", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
